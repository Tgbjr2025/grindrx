[project]
name = "anchor-server"
version = "0.1.0"
description = "Anchor — personal memory-prosthetic assistant (server core)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "anthropic>=0.40",
    "faster-whisper>=1.0",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
anchor-api = "anchor_server.api:main"
anchor-worker = "anchor_server.worker:main"
anchor-digest = "anchor_server.digest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anchor_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
